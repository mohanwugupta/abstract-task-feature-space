name: Feature-space pilot (offline)
on:
  push:
  pull_request:
jobs:
  offline-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-feature-space-viz.txt
      - run: python -m feature_space_pilot.scientific --config configs/feature_space_pilot.json --prepare
      - run: python -m pytest -q tests/feature_space_pilot
      - run: python -m feature_space_pilot.run --config configs/feature_space_pilot.json --stage tasks --dry-run
